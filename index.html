<head>
  <meta charset="utf-8" />

  <meta name="description" content="Join us in celebrating the retirement of CMSgt Thyiatira Singleton." />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="CMSgt Thyiatira Singleton Retirement Celebration" />
  <meta property="og:title" content="CMSgt Thyiatira Singleton Retirement Celebration" />
  <meta property="og:description" content="Join us in celebrating the retirement of CMSgt Thyiatira Singleton." />
  <meta property="og:url" content="https://chiefsingletonretires.com/" />
  <meta property="og:image" content="https://chiefsingletonretires.com/og-image.png" />

  <!-- X / Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="CMSgt Thyiatira Singleton Retirement Celebration" />
  <meta name="twitter:description" content="Join us in celebrating the retirement of CMSgt Thyiatira Singleton." />
  <meta name="twitter:image" content="https://chiefsingletonretires.com/og-image.png" />

  <style>
    :root {
      color-scheme: light dark;
      --bg: #0b1324;
      --panel: #101b31;
      --text: #f6f8fc;
      --muted: #b9c3d8;
      --line: rgba(255,255,255,.12);
      --accent: #d8b46a;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }
    .shell {
      height: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 18px;
      background: linear-gradient(180deg, rgba(16,27,49,.98), rgba(11,19,36,.96));
      border-bottom: 1px solid var(--line);
      box-shadow: 0 6px 24px rgba(0,0,0,.2);
      z-index: 2;
    }
    .brand { min-width: 0; }
    .eyebrow {
      margin: 0 0 2px;
      color: var(--accent);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .13em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(15px, 2.4vw, 20px);
      font-weight: 750;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .direct {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      padding: 0 15px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 750;
      font-size: 14px;
      color: #121212;
      background: var(--accent);
    }
    .frame-wrap { position: relative; min-height: 0; background: #fff; }
    iframe { width: 100%; height: 100%; border: 0; background: #fff; display: block; }
    .noscript {
      padding: 20px;
      font-size: 16px;
      background: #fff;
      color: #111;
    }
    @media (max-width: 620px) {
      .topbar { padding: 10px 12px; }
      .eyebrow { display: none; }
      h1 { font-size: 14px; max-width: 60vw; }
      .direct { min-height: 36px; padding: 0 12px; font-size: 13px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand">
        <p class="eyebrow">Retirement Celebration</p>
        <h1>CMSgt Thyiatira Singleton</h1>
      </div>
      <a class="direct" href="https://icarusinvites.com/e/cmsgt-thyiatira-singleton" target="_blank" rel="noopener noreferrer">Open RSVP</a>
    </header>

    <section class="frame-wrap" aria-label="Retirement invitation">
      <iframe
        title="CMSgt Thyiatira Singleton retirement invitation"
        src="https://icarusinvites.com/e/cmsgt-thyiatira-singleton"
        loading="eager"
        referrerpolicy="strict-origin-when-cross-origin"
        allow="clipboard-write"
      ></iframe>
      <noscript>
        <div class="noscript">
          JavaScript is disabled. <a href="https://icarusinvites.com/e/cmsgt-thyiatira-singleton">Open the invitation here.</a>
        </div>
      </noscript>
    </section>
  </main>
</body>
</html>
